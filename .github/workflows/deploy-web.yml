name: Deploy Frontend
on:
  workflow_dispatch:
    inputs:
      image_digest:
        description: "Digest sha256 da imagem web publicada pelo CI"
        required: true
        type: string
      environment:
        description: Ambiente de destino
        type: environment
        default: production
permissions:
  contents: read
  packages: read
jobs:
  deploy:
    uses: ./.github/workflows/deploy-vps.yml
    with:
      service: web
      image_digest: ${{ inputs.image_digest }}
      environment: ${{ inputs.environment }}
    secrets: inherit
