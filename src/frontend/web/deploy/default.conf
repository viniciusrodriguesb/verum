server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location = /health {
    access_log off;
    return 200 'ok';
  }

  location = /configuracao.json {
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }

  location = /index.html {
    add_header Cache-Control "no-store";
  }

  location /api/ {
    return 404;
  }

  location ~* "^/.*-[a-z0-9_-]{8,}\.(js|css)$" {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
