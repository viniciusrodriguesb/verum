      <path d="M56 50L19 69A41.5 41.5 0 0 1 56 8.5V50Z" fill="url(#varreduraRadar)"/>
      <path d="M56 13V87M19 50H93" stroke="#10B981" stroke-opacity="0.42" stroke-width="1.2"/>
      <path d="M29.8 23.8L82.2 76.2M29.8 76.2L82.2 23.8" stroke="#10B981" stroke-opacity="0.24" stroke-width="1"/>
