  fill="none"
  role="img"
  aria-labelledby="titulo descricao"
>
  <title id="titulo">Verum Radar</title>
  <desc id="descricao">Marca Verum Radar com ilustração de radar e lupa.</desc>

  <defs>
    <linearGradient id="contornoRadar" x1="22" y1="82" x2="91" y2="18" gradientUnits="userSpaceOnUse">
      <stop stop-color="#10B981"/>
      <stop offset="0.52" stop-color="#0EA5A8"/>
      <stop offset="1" stop-color="#1D4ED8"/>
