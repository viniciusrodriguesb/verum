<header class="cabecalho">
  <div class="cabecalho__conteudo">
    <a routerLink="/" class="cabecalho__marca" aria-label="Ir para a página inicial do Verum">
      <img
        src="images/verum-horizontal.png"
        width="180"
        height="60"
        alt="Verum"
        class="cabecalho__logo"
      />
    </a>

    <nav class="cabecalho__navegacao" aria-label="Navegação principal">
      @for (item of itensMenu; track item.rotulo) {
        <a
          [routerLink]="item.rota === '/para-empresas' ? null : item.rota"
          [attr.aria-disabled]="item.rota === '/para-empresas' ? true : null"
          [fragment]="item.fragmento"
          class="cabecalho__link"
        >
          {{ item.rotulo }}
        </a>
      }
    </nav>

    <div class="cabecalho__acoes">
      @if (autenticacao.autenticado()) {
        <a
          href="#"
          (click)="$event.preventDefault(); autenticacao.gerenciarConta()"
          class="cabecalho__entrar"
          >{{ autenticacao.nome() }}</a
        >
        <a
          href="#"
          (click)="$event.preventDefault(); autenticacao.sair()"
          class="cabecalho__criar-conta"
          >Sair</a
        >
      } @else {
        <a
          href="#"
          (click)="$event.preventDefault(); autenticacao.entrar()"
          class="cabecalho__entrar"
        >
          Entrar
        </a>

        <a
          href="#"
          (click)="$event.preventDefault(); autenticacao.cadastrar()"
          class="cabecalho__criar-conta"
        >
          Criar conta
        </a>
      }
    </div>
  </div>
</header>
