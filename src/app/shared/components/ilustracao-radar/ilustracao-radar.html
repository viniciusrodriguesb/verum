<div
  class="ilustracao-radar"
  [class.ilustracao-radar--grande]="tamanho() === 'grande'"
  [class.ilustracao-radar--animada]="animada()"
  aria-hidden="true"
>
  <div class="ilustracao-radar__visor">
    <div class="ilustracao-radar__varredura"></div>

    <div class="ilustracao-radar__circulo ilustracao-radar__circulo--externo"></div>

    <div class="ilustracao-radar__circulo ilustracao-radar__circulo--medio"></div>

    <div class="ilustracao-radar__circulo ilustracao-radar__circulo--interno"></div>

    <div class="ilustracao-radar__linha-horizontal"></div>
    <div class="ilustracao-radar__linha-vertical"></div>

    <div class="ilustracao-radar__centro"></div>

    <div class="ilustracao-radar__ponto ilustracao-radar__ponto--um"></div>

    <div class="ilustracao-radar__ponto ilustracao-radar__ponto--dois"></div>

    <div class="ilustracao-radar__cabo"></div>
  </div>
</div>
