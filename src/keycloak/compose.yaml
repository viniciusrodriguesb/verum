name: verum-keycloak

x-runtime: &runtime
  init: true
  restart: unless-stopped
  stop_grace_period: 30s
  security_opt:
    - no-new-privileges:true
  logging:
    driver: local
    options:
      max-size: 10m
      max-file: "3"

services:
  postgres:
    <<: *runtime
    image: postgres:16.15-alpine
    mem_limit: 512m
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Execute scripts/Initialize-Local.ps1 primeiro}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    <<: *runtime
    image: quay.io/keycloak/keycloak:26.8.0
    command: [start-dev, --import-realm]
    mem_limit: 2g
    cap_drop:
      - ALL
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?Execute scripts/Initialize-Local.ps1 primeiro}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-verum-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Execute scripts/Initialize-Local.ps1 primeiro}
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8081}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      VERUM_WEB_URL: ${VERUM_WEB_URL:-http://localhost:4200}
    ports:
      - 127.0.0.1:${KEYCLOAK_PORT:-8081}:8080
    volumes:
      - ./realms:/opt/keycloak/data/import:ro
    healthcheck:
      test:
        - CMD
        - /bin/bash
        - -c
        - "{ printf 'HEAD /health/ready HTTP/1.0\r\n\r\n' >&0; grep 'HTTP/1.0 200'; } 0<>/dev/tcp/localhost/9000"
      interval: 10s
      timeout: 5s
      start_period: 90s
      retries: 20

  mailpit:
    <<: *runtime
    image: axllent/mailpit:v1.31.5
    mem_limit: 256m
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: "100"
      MP_DISABLE_VERSION_CHECK: "true"
      MP_LABEL: Verum local
    ports:
      - 127.0.0.1:${MAILPIT_PORT:-8025}:8025
    volumes:
      - mailpit-data:/data

volumes:
  postgres-data:
  mailpit-data:
