image: node:24.15.0-alpine

workflow:
  rules:
    # Executa pipelines de Merge Request.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

    # Evita pipeline duplicado de branch quando já existe um Merge Request aberto.
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never

    # Executa em pushes para branches.
    - if: '$CI_COMMIT_BRANCH'

    # Executa em tags.
    - if: '$CI_COMMIT_TAG'

stages:
  - validacao
  - testes
  - seguranca
  - build

variables:
  CI: 'true'

  # Cache dentro do workspace para que o GitLab consiga persistir.
  NPM_CONFIG_CACHE: '$CI_PROJECT_DIR/.npm'

  # Evita verificações duplicadas durante cada npm ci.
  NPM_CONFIG_AUDIT: 'false'
  NPM_CONFIG_FUND: 'false'

  # Reduz ruído nos logs.
  NPM_CONFIG_PROGRESS: 'false'

default:
  interruptible: true
  timeout: 15 minutes

  before_script:
    - node --version
    - npm --version
    - npm ci --cache "$NPM_CONFIG_CACHE" --prefer-offline --no-audit --no-fund

  cache:
    key:
      prefix: npm
      files:
        - package-lock.json
    paths:
      - .npm/
    policy: pull-push

  retry:
    max: 1
    when:
      - api_failure
      - runner_system_failure
      - stuck_or_timeout_failure

validar-codigo:
  stage: validacao
  script:
    - npm run check

testar-aplicacao:
  stage: testes
  script:
    - >
      npm run test --
      --watch=false
      --coverage
      --coverage-reporters=text-summary
      --coverage-reporters=cobertura
  coverage: '/Statements\s*:\s*([\d.]+)%/'
  artifacts:
    name: 'cobertura-$CI_COMMIT_SHORT_SHA'
    when: always
    expire_in: 7 days
    paths:
      - coverage/
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/**/cobertura-coverage.xml

auditar-dependencias:
  stage: seguranca
  script:
    - npm audit --omit=dev --audit-level=high
  cache:
    key:
      prefix: npm
      files:
        - package-lock.json
    paths:
      - .npm/
    policy: pull

buildar-producao:
  stage: build
  needs:
    - validar-codigo
    - testar-aplicacao
    - auditar-dependencias
  script:
    - npm run build -- --configuration production
  artifacts:
    name: 'verum-web-$CI_COMMIT_SHORT_SHA'
    expire_in: 14 days
    when: on_success
    paths:
      - dist/
