services:
  edge:
    image: caddy:2-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    restart: unless-stopped
    env_file:
      - ${VERUM_CONFIG_DIR:?Configure VERUM_CONFIG_DIR}/edge.env
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"
    networks:
      - verum

volumes:
  caddy-data:
  caddy-config:

networks:
  verum:
    external: true
    name: verum
