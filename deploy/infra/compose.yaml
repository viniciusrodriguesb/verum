services:
  postgres:
    image: postgres:16.15-alpine
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: '3'
    environment:
      POSTGRES_DB: verum
      POSTGRES_USER: verum
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    stop_grace_period: 60s
    mem_limit: 1g
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U verum -d verum']
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      verum:
        aliases: [verum-postgres]

  redis:
    user: redis
    image: redis:8-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: '3'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Configure REDIS_PASSWORD}
    command: [sh, -ec, 'exec redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass "$$REDIS_PASSWORD"']
    volumes:
      - redis-data:/data
    mem_limit: 384m
    security_opt:
      - no-new-privileges:true
    networks:
      verum:
        aliases: [verum-redis]

  rabbitmq:
    image: rabbitmq:4-alpine@sha256:6931816af1a943f471c038b278835d36692d55dec769232739296bb91b7de0f5
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: '3'
    environment:
      RABBITMQ_DEFAULT_USER: verum
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Configure RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    mem_limit: 1g
    stop_grace_period: 60s
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      verum:
        aliases: [verum-rabbitmq]

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:

networks:
  verum:
    external: true
    name: verum
