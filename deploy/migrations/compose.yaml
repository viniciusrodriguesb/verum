services:
  migrations:
    image: ${APP_IMAGE:?Configure APP_IMAGE com digest}
    env_file:
      - ${VERUM_CONFIG_DIR:?Configure VERUM_CONFIG_DIR}/migrations.env
    init: true
    restart: "no"
    user: "1654"
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1g
    networks:
      - verum

networks:
  verum:
    external: true
    name: verum
